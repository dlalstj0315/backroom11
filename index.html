<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d',{alpha:false});
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const px4=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashN(...v){let h=2166136261;for(const x of v){h^=x|0;h=Math.imul(h,16777619)}return h>>>0}
$('ctrlInfo').innerHTML=isTouch
 ?'왼쪽 드래그 이동 · 오른쪽 드래그 시점(위아래도)<br>빛: 손전등 · 섬광: 섬광탄 · 물: 아몬드 워터<br>ID: 내 신분증 · 확인: 앞에 있는 탐험가 신분 확인'
 :'WASD 이동 · 마우스 시점(클릭하면 고정) · Shift 달리기<br>F 손전등 · G 섬광탄 · R 아몬드 워터<br>I 내 신분증 · C 앞에 있는 탐험가 신분 확인';

/* ================= 화면 ================= */
let W=320,H=180,img,buf,zbuf,focal,PL,vign,vignR,cone,PIX=isTouch?62000:95000;
function resize(){
  const a=innerWidth/innerHeight;
  H=Math.round(Math.sqrt(PIX/a));W=Math.round(H*a);
  cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
  img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);zbuf=new Float32Array(W);
  PL=Math.min(.85,Math.max(.45,.5*a));focal=W/(2*PL);
  mkHands();
  vign=mk(W,H);const g=vign.getContext('2d');
  const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.82)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  vignR=mk(W,H);{const g2=vignR.getContext('2d'),r2=g2.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);
  r2.addColorStop(0,'rgba(120,0,0,0)');r2.addColorStop(1,'rgba(150,0,0,.9)');g2.fillStyle=r2;g2.fillRect(0,0,W,H)}
  cone=new Float32Array(W*H);const R=Math.min(W,H)*.62;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(x-W/2)/R,dy=(y-H/2)/R;const v=1-(dx*dx+dy*dy);cone[y*W+x]=v>0?v*v:0}
}
addEventListener('resize',resize);
let HANDS=null,handCol=0;
function mkHands(){const hh=Math.round(H*.62),hw=Math.round(hh*.9),C=SUIT[handCol]||SUIT[0];HANDS=[0,1].map(on=>{const c=mk(hw,hh),g=c.getContext('2d');
  const u=hh/100;
  // 손전등 몸통
  const fx0=hw*.62,fy0=hh*.62,fx1=hw*.34,fy1=hh*.3;
  g.lineCap='round';for(const[k,m]of[[1,'#151518'],[.75,'#2a2b30'],[.4,'#4a4c54'],[.15,'#7a7d86']]){g.strokeStyle=m;g.lineWidth=12*u*k;g.beginPath();g.moveTo(fx0-(1-k)*3*u,fy0);g.lineTo(fx1-(1-k)*3*u,fy1);g.stroke()}
  g.fillStyle='#1c1c20';g.beginPath();g.ellipse(fx1,fy1,9*u,7.5*u,-.85,0,7);g.fill();
  const lg=g.createRadialGradient(fx1-1*u,fy1-1*u,.5,fx1,fy1,6.5*u);if(on){lg.addColorStop(0,'#fffef0');lg.addColorStop(.6,'#ffe9a0');lg.addColorStop(1,'#a08a40')}else{lg.addColorStop(0,'#5a5c62');lg.addColorStop(1,'#202124')}
  g.fillStyle=lg;g.beginPath();g.ellipse(fx1,fy1,6.5*u,5.2*u,-.85,0,7);g.fill();
  // 소매
  tube(g,[[hw*1.05,hh*1.08],[hw*.86,hh*.86],[hw*.7,hh*.72]],30*u,C);
  g.strokeStyle=shc(C,.6);g.lineWidth=1.5*u;for(let i=0;i<3;i++){g.beginPath();g.arc(hw*(.86+i*.05),hh*(.88+i*.05),12*u,3.6,4.6);g.stroke()}
  // 장갑
  blob(g,hw*.64,hh*.66,13*u,11*u,BLK,-.8);for(let i=0;i<3;i++)blob(g,hw*(.55+i*.04),hh*(.6+i*.06),5*u,4*u,BLK,-.8);
  blob(g,hw*.7,hh*.6,5*u,7*u,BLK,-.3);
  return c})}

/* ================= 텍스처 ================= */
function noiseFill(g,w,h,base,amt){const id=g.createImageData(w,h);
  for(let i=0;i<w*h;i++){const n=(Math.random()-.5)*amt;id.data[i*4]=base[0]+n;id.data[i*4+1]=base[1]+n;id.data[i*4+2]=base[2]+n*.8;id.data[i*4+3]=255}
  g.putImageData(id,0,0)}
function blots(g,n,col,rmax){for(let i=0;i<n;i++){const x=Math.random()*64,y=Math.random()*64,r=3+Math.random()*rmax;
  const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}}
function makeTex(sp){
  const c=mk(64,64),g=c.getContext('2d'),[r,gg,b]=sp.b;
  const amt={carpet:30,rock:44,concrete:22,plain:8,tiles:6,pool:8,grate:16}[sp.p]??14;
  noiseFill(g,64,64,sp.b,amt);
  const C=(m,a)=>`rgba(${Math.min(255,r*m|0)},${Math.min(255,gg*m|0)},${Math.min(255,b*m|0)},${a})`;
  switch(sp.p){
    case'paper':g.fillStyle=C(.62,.16);for(let x=0;x<64;x+=8)g.fillRect(x,0,1,64);
      g.fillStyle=C(.7,.22);for(let y=4;y<56;y+=8)for(let x=((y/8|0)%2)*4;x<64;x+=8)g.fillRect(x+2,y,2,2);
      blots(g,4,C(.5,.2),12);g.fillStyle=C(.55,1);g.fillRect(0,58,64,6);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,57,64,1);break;
    case'carpet':blots(g,6,C(.45,.28),10);break;
    case'tile':g.fillStyle=C(.72,1);g.fillRect(0,0,64,1);g.fillRect(0,0,1,64);g.fillRect(0,32,64,1);g.fillRect(32,0,1,64);blots(g,2,C(.6,.25),8);break;
    case'concrete':blots(g,7,C(.6,.3),14);g.strokeStyle=C(.35,.7);g.lineWidth=.7;
      for(let k=0;k<2;k++){g.beginPath();let x=Math.random()*64,y=Math.random()*64;g.moveTo(x,y);for(let i=0;i<5;i++){x+=(Math.random()-.5)*16;y+=Math.random()*10;g.lineTo(x,y)}g.stroke()}break;
    case'pipe':for(const y of[6,22,42]){g.fillStyle=C(.65,1);g.fillRect(0,y,64,10);g.fillStyle=C(1.35,.7);g.fillRect(0,y+2,64,2);g.fillStyle=C(.35,1);g.fillRect(0,y+9,64,1);
      g.fillStyle=C(.45,1);for(let x=4;x<64;x+=20)g.fillRect(x,y-1,3,12)}blots(g,3,'rgba(90,40,10,.3)',10);break;
    case'panel':g.strokeStyle=C(.5,1);g.strokeRect(3.5,3.5,57,46);g.fillStyle=C(.55,1);for(let y=12;y<40;y+=5)g.fillRect(10,y,20,2);
      for(let x=0;x<64;x+=8){g.fillStyle=(x/8)%2?'#d8b21c':'#151310';g.beginPath();g.moveTo(x,64);g.lineTo(x+8,54);g.lineTo(x+16,54);g.lineTo(x+8,64);g.fill()}break;
    case'grate':g.fillStyle=C(.35,1);for(let x=0;x<64;x+=8){g.fillRect(x,0,2,64);g.fillRect(0,x,64,2)}break;
    case'plain':g.fillStyle=C(.6,1);g.fillRect(0,59,64,5);blots(g,2,C(.8,.15),14);break;
    case'wood':for(let y=0;y<64;y+=16){g.fillStyle=C(.55,1);g.fillRect(0,y,64,1);}g.strokeStyle=C(.78,.45);g.lineWidth=.6;
      for(let k=0;k<14;k++){const y=Math.random()*64;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(20,y+(Math.random()-.5)*4,40,y+(Math.random()-.5)*4,64,y);g.stroke()}break;
    case'tiles':g.fillStyle=C(.74,1);for(let x=0;x<64;x+=16){g.fillRect(x,0,1,64);g.fillRect(0,x,64,1)}break;
    case'pool':g.fillStyle=C(1.25,.7);for(let x=0;x<64;x+=16){g.fillRect(x,0,1,64);g.fillRect(0,x,64,1)}
      g.strokeStyle=C(1.5,.28);g.lineWidth=1;for(let k=0;k<5;k++){g.beginPath();const y=Math.random()*64;g.moveTo(0,y);for(let x=0;x<=64;x+=8)g.lineTo(x,y+Math.sin(x*.3+k)*3);g.stroke()}break;
    case'rock':blots(g,9,C(.5,.4),16);blots(g,5,C(1.3,.25),10);break;
    case'brick':g.fillStyle=C(.5,1);for(let y=0;y<64;y+=8){g.fillRect(0,y,64,1);for(let x=((y/8)%2)*8;x<64;x+=16)g.fillRect(x,y,1,8)}blots(g,5,C(.4,.35),12);break;
    case'party':for(let x=0;x<64;x+=16){g.fillStyle=C(1.12,.5);g.fillRect(x,0,8,58)}
      const cc=['#ff4d6d','#4dc3ff','#7dff6a','#ffd23f','#c77dff'];for(let k=0;k<40;k++){g.fillStyle=cc[k%5];g.fillRect(Math.random()*64|0,Math.random()*56|0,2,2)}
      g.fillStyle=C(.55,1);g.fillRect(0,58,64,6);break;
    case'metal':g.fillStyle=C(.55,1);g.fillRect(0,0,64,1);g.fillRect(0,32,64,1);g.fillRect(31,0,1,64);g.fillStyle=C(1.3,.6);
      for(const[x,y]of[[3,3],[28,3],[35,3],[60,3],[3,35],[28,35],[35,35],[60,35]])g.fillRect(x,y,2,2);
      g.strokeStyle=C(1.2,.25);g.lineWidth=.5;for(let k=0;k<8;k++){g.beginPath();const x=Math.random()*64,y=Math.random()*64;g.moveTo(x,y);g.lineTo(x+jit(14),y+jit(4));g.stroke()}blots(g,3,'rgba(90,50,20,.3)',10);break;
  }
  return{c,d:px4(c)};
}
const WRIT=['나가','뒤에 있어','보지마','끝이 없어','도와줘','웃지마','소리 내지 마','계속 걸어'];
function makeDecal(wallC,kind,WL){WL=WL||WRIT;const c=mk(64,64),g=c.getContext('2d');g.drawImage(wallC,0,0);
  if(kind<WL.length){const t=WL[kind];g.save();g.translate(32,30);g.rotate(jit(.25));g.font='bold '+(t.length>3?10:15)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillStyle='rgba(70,8,4,.85)';g.fillText(t,0,0);g.fillStyle='rgba(70,8,4,.5)';for(let i=0;i<5;i++)g.fillRect(-14+Math.random()*28,4,1,4+Math.random()*12);g.restore()}
  else if(kind===WL.length){g.fillStyle='rgba(60,10,6,.7)';for(let h=0;h<3;h++){const x=10+h*16+jit(4),y=18+jit(8);g.beginPath();g.ellipse(x,y+6,4,5,0,0,7);g.fill();for(let f=0;f<5;f++){g.fillRect(x-4+f*2,y-4+Math.abs(f-2),1.4,8)}}}
  else{g.strokeStyle='rgba(30,20,10,.75)';g.lineWidth=1;for(let s=0;s<3;s++){const x=14+s*14;g.beginPath();g.moveTo(x,6);for(let k=0;k<4;k++)g.lineTo(x+k*2+jit(2),20+k*12);g.stroke()}}
  return px4(c)}

function pjHostTick(){const s={};for(const k in PJ.st)s[k]=PJ.st[k];s[PJ.id]=PJ.mine;const msg={t:'st',s};for(const c of PJ.conns.values()){if(c.open)try{c.send(msg)}catch(e){}}}

    c.on('open',()=>{PJ.open=true;clearInterval(PJ.tick);PJ.tick=setInterval(()=>{if(c.open)try{c.send({t:'p',p:PJ.mine})}catch(e){}},50);if(!done){done=true;clearTimeout(to);res()}});

function pjErr(e){const t=e&&e.type;return t==='peer-unavailable'?'그 코드의 방을 못 찾았어. 코드를 확인하거나, 방장이 방을 다시 만들어줘.':t==='full'?'방이 가득 찼어 (최대 3명)':
  t==='timeout'?'연결 시간 초과. 와이파이로 바꿔서 다시 해봐 (일부 모바일 데이터망은 연결이 막혀).':t==='browser-incompatible'?'이 브라우저는 지원이 안 돼. 크롬이나 사파리 최신 버전으로 열어줘.':
  '연결 서버에 접속 못 했어 ('+(t||'오류')+'). 인터넷 확인하고 다시 눌러줘.'}
function players(){if(!groom)return[];return groom.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.nm).slice().sort((a,b)=>(b.presence.cr|0)-(a.presence.cr|0)||(a.presence.jt||0)-(b.presence.jt||0)||(a.peer<b.peer?-1:1))}

function applyH(Hh,dt){

    if(ch&&!e.chase)onChase(e);e.chase=ch;if(!was&&e.active){e.rx=a[1];e.ry=a[2];if(e.t==='smiler')onSmiler()}
    if(Math.abs(a[1]-e.x)+Math.abs(a[2]-e.y)>.002)e.mvT=.3;e.x=a[1];e.y=a[2];e.frame=a[4]|0;e.pose=a[5]|0})

function remotes(){if(!mp)return[];return players().filter(p=>!p.sameTab&&p.presence.ph==='play'&&p.presence.lv===lv&&p.presence.at===att)}

  if(!mp||!groom)return;

    if(Hh&&typeof Hh.lv==='number'){
      if(state!=='play'&&state!=='scare'||Hh.lv!==lv||Hh.at!==att||Hh.sd!==seed){if(Hh.lv!==lv)invStart=null;startLevel(Hh.lv,Hh.at,Hh.sd)}

/* ================= 호스트 AI ================= */
let repathT=0;
function alivePlayers(){
  const P=[];if(!me.dead)P.push({x:me.x,y:me.y,a:me.a,pt:me.p,sp:me.sp,mv:me.mv,fl:me.fl&&inv.bat>0,fv:Math.atan(PL),inv:invulnT>0});
  for(const p of remotes()){const r=p.presence;if(!r.dd)P.push({x:r.x,y:r.y,a:r.a,pt:r.pt||0,sp:!!r.sp,mv:!!r.mv,fl:!!r.fl,fv:r.fv||.7})}

function placeEnt(e,minD,maxD,P){
  if(e.t==='smiler'&&TH.gen==='runway'){e.x=e.rx=1.6;e.y=e.ry=2.5;e.tx=e.x;e.ty=e.y;e.prev=-1;e.active=true;e.chase=true;repathT=0;onSmiler();return}
  bfsMulti(P.map(p=>cellOf(p.x,p.y)),distF);const cand=[];
  for(let c=0;c<N*N;c++)if(distF[c]>=minD&&distF[c]<=maxD)cand.push(c);
  if(!cand.length)for(let c=0;c<N*N;c++)if(distF[c]>=6)cand.push(c);
  if(!cand.length)return;const c=cand[Math.random()*cand.length|0];
  e.x=e.rx=c%N+.5;e.y=e.ry=(c/N|0)+.5;e.tx=e.x;e.ty=e.y;e.prev=-1;e.active=true;e.far=0;e.chase=false;e.mode=0;repathT=0;e.timer=e.t==='wailer'?7:0;e.pose=e.t==='mimic'?(Math.random()*3|0):0}
function moveTo(e,x,y,spd,dt){const dx=x-e.x,dy=y-e.y,l=Math.hypot(dx,dy);if(l>1e-4){const m=Math.min(l,spd*dt);e.x+=dx/l*m;e.y+=dy/l*m;e.moved=true}}

function stepField(e,f,spd,dt,bias){
  if(Math.hypot(e.tx-e.x,e.ty-e.y)<.06){
    const c=cellOf(e.x,e.y),n4=[c-1,c+1,c-N,c+N].filter(k=>map[k]===0&&(!f||f[k]>=0));let pick=c;
    if(n4.length){if(f&&bias<0)pick=n4.reduce((a,b)=>f[b]>f[a]?b:a);
      else if(f&&Math.random()<bias)pick=n4.reduce((a,b)=>f[b]<f[a]?b:a);
      else{const alt=n4.filter(k=>k!==e.prev),arr=alt.length?alt:n4;pick=arr[Math.random()*arr.length|0]}}
    e.prev=c;e.tx=pick%N+.5;e.ty=(pick/N|0)+.5}
  moveTo(e,e.tx,e.ty,spd,dt)}
function nearest(e,P){let b=null,bd=1e9;for(const p of P){const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<bd){bd=d;b=p}}return{p:b,d:bd}}

  if(d>1.2&&!los(p.x,p.y,e.x,e.y))continue;if(lgAt(e.x,e.y)>.12||(p.fl&&da<.45&&d<11))return true}return false}
function onChase(e){const c=camPos();const d=Math.hypot(c.x-e.rx,c.y-e.ry);if(d<16){if(e.t==='crawler'){for(let i=0;i<6;i++)setTimeout(()=>noiseHit(.04,3500,.25,'highpass'),i*50)}else sSting();say({crawler:'들었어. 멈춰…',mimic:'저건 사람이 아니야!',stalker:'뛰어.',hound:'사냥개가 봤다! 시야를 끊어!',lightbane:'빛을 보고 온다! 손전등 꺼!'}[e.t]||'뛰어.',2)}}
function alertAll(p){for(const o of ents){if(!o.active||o.stun>0)continue;
  if(o.t==='stalker'||o.t==='mimic'){if(!o.chase)onChase(o);o.chase=true;o.lost=0}
  if(o.t==='crawler'){o.mode=1;o.timer=8;o.chase=true;o.field=o.field||new Int16Array(N*N);bfsMulti([cellOf(p.x,p.y)],o.field);o.tx=o.x;o.ty=o.y}}}
function stunAround(x,y){for(const e of ents){if(e.active&&Math.hypot(e.x-x,e.y-y)<9){e.stun=4.5;e.chase=false;e.mode=0}}}

  const P=alivePlayers();

      if(e.mode===1){e.timer-=dt;const spd=3.25*sp0+diff*.55;

        if(e.timer<=0){e.mode=0;e.chase=false}}
      else{e.timer-=dt;if(e.timer<=0){e.timer=2+Math.random()*4;e.idle=Math.random()<.5}if(e.idle)stepField(e,distF,.7,dt,.3)}

      if(!seenBy(e,P)){const spd=(n.d>10?2.3:3.3)*sp0+diff*.5;

    }else if(e.t==='grinner'){
      let lit=false;for(const p of P){if(!p.fl)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<9&&Math.abs(angTo(p,e.x,e.y))<.3&&los(p.x,p.y,e.x,e.y)){lit=true;break}}
      if(lit){if(e.mode!==2)e.tx=e.x,e.ty=e.y;e.mode=2;e.timer=1.6}
      if(e.mode===2){e.timer-=dt;stepField(e,distF,2.7,dt,-1);if(e.timer<=0)e.mode=0}
      else{const spd=(lgAt(e.x,e.y)>.6?.7:1.65)*sp0+diff*.4;if(n.d<2&&los(e.x,e.y,n.p.x,n.p.y))direct(e,n.p,spd,dt);else stepField(e,distF,spd,dt,.9)}
    }else if(e.t==='mimic'){
      const see=n.d<14&&los(e.x,e.y,n.p.x,n.p.y);
      if(!e.chase){if(n.d<5&&see){e.near=(e.near||0)+dt}else e.near=0;
        if((n.d<2.0&&see)||e.near>7){e.chase=true;e.lost=0;e.near=0;onChase(e)}else if(n.d<5&&see){}else{e.timer-=dt;if(e.timer<=0){e.timer=3+Math.random()*5;e.idle=Math.random()<.4}if(e.idle)stepField(e,distF,.8,dt,.5)}}
      else{if(see)e.lost=0;else{e.lost+=dt;if(e.lost>8){e.chase=false;e.pose=Math.random()*3|0}}
        const spd=3.05*sp0+diff*.5;if(see&&n.d<3)direct(e,n.p,spd,dt);else stepField(e,distF,spd,dt,1)}

      else{e.chase=false;stepField(e,distF,.9*sp0,dt,.4)}

}

  let h=hashN(...[...code].map(ch=>ch.charCodeAt(0)));let x=4;while(x<272){h=Math.imul(h^h>>>13,1103515245)+12345>>>0;const w=1+(h%3);if((h>>5)&1)g.fillRect(x,2,w,18);x+=w+1}
  if(fake){g.fillStyle='rgba(179,38,30,.85)';for(let i=0;i<5;i++)g.fillRect(Math.random()*270,Math.random()*18,20,3)}}
function showID(d,mode){
  const el=$('idc');el.classList.remove('hidden');
  const rows=[['이름',d.nm||'?'],['번호',d.idn||'?'],['혈액형',d.bt||'?'],['발급일',d.iss||'?'],['최고 깊이',d.bd!=null?String(d.bd):'?'],['소속','M.E.G. 현장 탐사대']];
  const info=$('idInfo');info.innerHTML='';for(const[k,v]of rows){const r=document.createElement('div');const b=document.createElement('b');b.textContent=k;r.append(b,document.createTextNode(' '+v));info.appendChild(r)}
  drawIdPhoto(d.ci||0,false);drawBar(d.idn||'x',false);
  const res=$('idRes');res.className='';clearTimeout(idTimer);
  if(mode==='mine'){res.textContent='본인 신분증';idTimer=setTimeout(()=>el.classList.add('hidden'),4000);return}
  res.textContent='신분 확인 중';let n=0;const tick=setInterval(()=>{n++;res.textContent='신분 확인 중'+'.'.repeat(n%4);noiseHit(.03,3000,.05,'highpass')},250);
  idTimer=setTimeout(()=>{clearInterval(tick);
    if(d.fake){res.className='idbad';res.textContent='불일치 — 등록되지 않은 탐험가. 도망쳐!';drawIdPhoto(d.ci||0,true);drawBar(d.idn||'x',true);sSting();say('가짜다! 도망쳐!',2.5);shake=.8}
    else{res.className='idok';res.textContent='확인됨 — 등록된 M.E.G. 탐험가';tone(880,.15,.08,'triangle');setTimeout(()=>tone(1320,.2,.07,'triangle'),120)}
    idTimer=setTimeout(()=>el.classList.add('hidden'),3500)},1700);
}
function myIdData(){return{nm:myName||getName(),idn:PROF.idn,bt:PROF.bt,iss:PROF.iss,bd:best,ci:mp?myIndex():0}}

function checkID(){
  if(state!=='play'||me.dead)return;if(chkCD>0)return;
  let best2=null,bd2=4.6;const ps=mp?players():[];
  const consider=(x,y,data)=>{const d=Math.hypot(x-me.x,y-me.y);if(d>=bd2)return;if(Math.abs(angTo(me,x,y))>.5)return;if(d>1.2&&!los(me.x,me.y,x,y))return;bd2=d;best2=data};
  ps.forEach((p,i)=>{if(p.sameTab)return;const q=p.presence;if(q.ph!=='play'||q.lv!==lv||q.dd)return;consider(q.x,q.y,{nm:q.nm,idn:q.idn,bt:q.bt,iss:q.iss,bd:q.bd,ci:Math.min(2,i)})});
  for(const e of ents){if(e.t!=='mimic'||!e.active||e.chase)continue;const ci=(e.pose|0)%3;const pp=ps[ci%Math.max(1,ps.length)];
    const r=mulberry(hashN(e.pose,lv,7));consider(e.rx,e.ry,{nm:pp?pp.presence.nm:'탐험가',idn:'MEG-'+(1000+(r()*9000|0))+'-'+'=)?'[r()*3|0],bt:'??',iss:'0000.00.00',bd:'-',ci,fake:true})}
  if(!best2){say('앞에 확인할 탐험가가 없어',1.5);return}
  chkCD=2.5;showID(best2,'check');
}

const NOROOM='같이 하기 연결 모듈을 못 불러왔어.\n인터넷 연결을 확인하고 새로고침해줘.';

  const st=netReady();if(st==='pending')mpStatus('연결 준비 중…');else if(st==='none')mpStatus(NOROOM);else mpStatus('준비됨. 방을 만들거나 코드를 넣어줘');
  $('mkRoom').disabled=$('joinBtn').disabled=st!=='ok'}

const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){let c='';for(let i=0;i<4;i++)c+=CODECH[Math.random()*CODECH.length|0];return c}

async function joinRoom(c){
  const st=netReady();if(st!=='ok'){mpStatus(st==='pending'?'아직 준비 중이야. 몇 초 뒤에 다시 눌러줘.':NOROOM);return}
  mpStatus('연결 중… (최대 15초)');$('mkRoom').disabled=$('joinBtn').disabled=true;
  if(backend==='room'){
    try{groom=await room.join('br-'+c.toLowerCase())}catch(e){const k=e&&e.code;$('mkRoom').disabled=$('joinBtn').disabled=false;
      mpStatus(k==='limit_reached'?'방이 너무 많아. 잠깐 뒤에 다시 해줘.':'방에 못 들어갔어 ('+(k||'오류')+'). 다시 눌러줘.');return}
  }else{
    try{if(iCreated){let ok=false;for(let t=0;t<4&&!ok;t++){try{await pjHost(c);ok=true}catch(e){if(e&&e.type==='unavailable-id'){c=newCode();continue}throw e}}if(!ok)throw{type:'unavailable-id'}}
      else await pjJoin(c);groom=pjApi}
    catch(e){$('mkRoom').disabled=$('joinBtn').disabled=false;pjClose();mpStatus(pjErr(e));return}
  }
  $('mkRoom').disabled=$('joinBtn').disabled=false;
  mp=true;myJT=Date.now();inv={...INV0};invStart=null;
  $('codeShow').textContent=c;$('mpJoin').classList.add('hidden');$('mpLobby').classList.remove('hidden');mpStatus('');
  groom.onPeers(()=>renderLobby(),()=>{mpStatus('연결이 끊겼어');});
  sendPresence(true);renderLobby();
  clearInterval(window._lobbyT);window._lobbyT=setInterval(()=>{if(groom&&state!=='play')renderLobby()},1000);
  setTimeout(()=>{const i=players().findIndex(p=>p.sameTab);if(i>=3){groom.leave().catch(()=>{});groom=null;mp=false;$('mpLobby').classList.add('hidden');$('mpJoin').classList.remove('hidden');mpStatus('방이 가득 찼어 (최대 3명)')}},1800);
}
function renderLobby(){
  if(!groom)return;const ps=players().slice(0,3);const el=$('plist');el.innerHTML='';
  ps.forEach((p,i)=>{const d=document.createElement('div');d.style.color=PCOLT[i];d.textContent=(i===0?'[방장] ':'● ')+p.presence.nm+(p.sameTab?' (나)':'')+(p.presence.ph==='play'?' — 게임 중':'');el.appendChild(d)});
  const conn=groom.connected();$('mpStatus').textContent=(conn?'연결됨':'연결 끊김… 재연결 중')+' · 방 인원 '+players().length+'명'+(players().length<2?(backend==='peer'?'\n친구가 같은 주소로 들어와서 이 코드를 넣으면 돼':'\n친구가 안 보이면: 같은 코드인지, 친구가 공유 초대로 열었는지 확인해줘'):'');
  const host=amHost();$('goBtn').classList.toggle('hidden',!host);$('waitTxt').textContent=host?(ps.length<2?'친구가 들어오면 시작해. 혼자 먼저 시작해도 돼.':ps.length+'명 준비됨'):'방장이 시작하길 기다리는 중…';
}
